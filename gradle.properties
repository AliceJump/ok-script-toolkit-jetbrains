pluginGroup=com.alicejump.okscripttoolkit
pluginName=ok-script Toolkit
pluginVersion=1.13.0
platformVersion=2025.1.1.1
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true

# 显式给出内存上限。IntelliJ Platform 的 compileKotlin 要一次性读入整套
# 平台 API 存根，默认堆偏紧；本机 16GB 上若同时有别的 Gradle 构建在跑
# （例如并发的 test + buildPlugin），Kotlin 守护进程会直接
# `OutOfMemoryError: Java heap space` 让 compileKotlin 失败 ——
# 报错信息是 "Not enough memory to run compilation"，容易被误读成代码问题。
# 2026-09-20 实测：两个构建并发时必崩，串行则 40s 通过。
# 给守护进程一个明确的 2G，避免它跟别的 JVM 抢默认堆。
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
