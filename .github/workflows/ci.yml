name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out shared Python scripts and convention schema
        uses: actions/checkout@v4
        with:
          repository: AliceJump/ok-script-toolkit
          # Pin the exact shared core used by this plugin revision.
          ref: 301885f426b57d5ce585b4da97f33680e39bac54
          path: parent-source
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # 配置缓存里可能含凭据，Action 只有拿到这把密钥才会保存和恢复它。
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # ⚠️ 这里**没有也不该有** `verifyPlugin`（Plugin Verifier：真的下载 IDE 去查
      # 废弃 / 实验性 / internal API）：
      #   1. 它慢且要联网，真正的校验放在父仓 `release.yml`；
      #   2. 此处只构建可安装的 ZIP，共享脚本和 schema 由上一步单独检出并显式传给 Gradle。
      # ⚠️ `verifyPluginStructure` 只查 JAR / plugin.xml 的**结构**，**不查 API 兼容性** ——
      # 别把它当成"API 已经验过了"。
      - name: Test and build plugin
        run: ./gradlew -PpythonScriptsDir=parent-source/python -PconventionSchemaFile=parent-source/schemas/ok-script-toolkit.schema.json test buildPlugin verifyPluginStructure verifyPluginConfiguration
      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: ok-script-toolkit-jetbrains
          path: build/distributions/*.zip
          if-no-files-found: error
