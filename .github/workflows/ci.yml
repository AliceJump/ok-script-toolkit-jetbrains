name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: jetbrains-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-scripts:
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      matrix:
        engine: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Test review helpers and captured thread fixtures
        shell: pwsh
        run: ${{ matrix.engine }} -NoProfile -File ./.agents/skills/ok-script-pr-review/test-coderabbit-helpers.ps1
      - name: Test head and quota waiter scenarios
        shell: pwsh
        run: ${{ matrix.engine }} -NoProfile -File ./.agents/skills/ok-script-pr-review/test-coderabbit-wait-mock.ps1
      - name: Test read-only thread waiter scenarios
        shell: pwsh
        run: ${{ matrix.engine }} -NoProfile -File ./.agents/skills/ok-script-pr-review/test-review-threads-mock.ps1

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out shared Python scripts and convention schema
        uses: actions/checkout@v4
        with:
          repository: AliceJump/ok-script-toolkit
          # Pin the exact shared core used by this plugin revision.
          ref: b3c920cf71cb1637634c6fa89268e2609196514f
          path: parent-source
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # 配置缓存里可能含凭据，Action 只有拿到这把密钥才会保存和恢复它。
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # 临时用于本 PR 的两轮跨运行缓存验证；验证完成后移除，恢复 PR 默认只读。
          cache-read-only: false
          # IntelliJ Platform Gradle Plugin 默认把产品列表和 localPlatformArtifacts
          # 放在工作区 .intellijPlatform/；Hosted Runner 每次重建工作区会让
          # configuration cache 记录的输入消失。移到 Gradle home 后随 setup-gradle
          # 一起跨运行恢复，同时不缓存完整 IDE，避免显著放大缓存体积。
          gradle-home-cache-includes: |
            caches
            intellij-platform
      # ⚠️ 这里**没有也不该有** `verifyPlugin`（Plugin Verifier：真的下载 IDE 去查
      # 废弃 / 实验性 / internal API）：
      #   1. 它慢且要联网，真正的校验放在父仓 `release.yml`；
      #   2. 此处只构建可安装的 ZIP，共享脚本和 schema 由上一步单独检出并显式传给 Gradle。
      # ⚠️ `verifyPluginStructure` 只查 JAR / plugin.xml 的**结构**，**不查 API 兼容性** ——
      # 别把它当成"API 已经验过了"。
      - name: Test and build plugin
        run: ./gradlew -Porg.jetbrains.intellij.platform.intellijPlatformCache="$HOME/.gradle/intellij-platform" -PpythonScriptsDir=parent-source/python -PconventionSchemaFile=parent-source/schemas/ok-script-toolkit.schema.json test buildPlugin verifyPluginStructure verifyPluginConfiguration
      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: ok-script-toolkit-jetbrains
          path: build/distributions/*.zip
          if-no-files-found: error
