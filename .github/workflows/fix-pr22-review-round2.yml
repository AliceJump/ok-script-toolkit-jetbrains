name: Apply PR 22 review entrypoint migration

on:
  push:
    branches:
      - codex/unified-annotation-resources-parity
    paths:
      - .github/workflows/fix-pr22-review-round2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unified-annotation-resources-parity
          fetch-depth: 0
      - name: Migrate legacy resource entrypoints
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if count is not None and found != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {found}: {old!r}')
              if found == 0:
                  raise SystemExit(f'{path}: missing anchor: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          ui = 'src/main/kotlin/com/alicejump/okscripttoolkit/ui/TemplateAssetToolWindowFactory.kt'
          replace(
              ui,
              '.getToolWindow(TemplateAssetPanel.TOOL_WINDOW_ID)',
              '.getToolWindow(UNIFIED_ANNOTATION_TOOL_WINDOW_ID)',
              count=2,
          )
          replace(
              ui,
              'content.getUserData(TemplateAssetPanel.PANEL_KEY)?.screenshotNow()',
              'content.getUserData(UNIFIED_ANNOTATION_PANEL_KEY)?.screenshotNow()',
              count=1,
          )

          task = 'src/main/kotlin/com/alicejump/okscripttoolkit/tasklauncher/TaskLauncherToolWindowFactory.kt'
          p = Path(task)
          text = p.read_text(encoding='utf-8')
          anchor = 'import com.alicejump.okscripttoolkit.ui.ToolbarAction\n'
          imports = (
              'import com.alicejump.okscripttoolkit.ui.ToolbarAction\n'
              'import com.alicejump.okscripttoolkit.ui.UNIFIED_ANNOTATION_TOOL_WINDOW_ID\n'
              'import com.alicejump.okscripttoolkit.ui.UNIFIED_RESOURCE_PREVIEW_TOOL_WINDOW_ID\n'
          )
          if anchor not in text:
              raise SystemExit('task launcher: import anchor missing')
          text = text.replace(anchor, imports, 1)
          if text.count('showToolWindow("ok-script Templates")') != 1:
              raise SystemExit('task launcher: Templates entry count mismatch')
          if text.count('showToolWindow("ok-script Assets")') != 1:
              raise SystemExit('task launcher: Assets entry count mismatch')
          text = text.replace('showToolWindow("ok-script Templates")', 'showToolWindow(UNIFIED_RESOURCE_PREVIEW_TOOL_WINDOW_ID)', 1)
          text = text.replace('showToolWindow("ok-script Assets")', 'showToolWindow(UNIFIED_ANNOTATION_TOOL_WINDOW_ID)', 1)
          p.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/fix-pr22-review-round2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: migrate legacy resource entrypoints"
          git push origin HEAD:codex/unified-annotation-resources-parity
